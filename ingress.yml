##makeup-Deploy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: makeup-dply
spec:
  selector:
    matchLabels:
      app: makeup
  replicas: 3
  template:
    metadata:
      name: tmplt1
      labels:
        app: makeup
    spec:
      containers:
        - name: con1
          image: apsanadevops/beauty:makeup
          ports:
            - containerPort: 80


##makeup-Svc
---
apiVersion: v1
kind: Service
metadata:
  name: svc1
spec:
  type: LoadBalancer
  selector:
    app: makeup
  ports:
    - port: 80
      targetPort: 80


