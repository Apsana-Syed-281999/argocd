###Ingress
---
apiVersion:  networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing1
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /makeup(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc1
                port:
                  number: 80

          - path: /jewels(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc2
                port:
                  number: 80
          - path: /shoes(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc3
                port:
                  number: 80
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc4
                port:
                  number: 80
