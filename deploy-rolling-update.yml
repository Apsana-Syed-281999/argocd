---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dply1
spec:
  selector:
    matchLabels:
      app: makeup
      env: dev
  replicas: 3
  template:
    metadata:
      name: tmplt1
      labels:
        app: makeup
        env: dev
    spec:
      containers:
        - image: apsanadevops/beauty:makeup
          name: con-1
          ports:
            - containerPort: 80
          env:
            - name: env2
              valueFrom:
                configMapKeyRef:
                  name: cm4
                  key: app
            - name: env4
              valueFrom:
                secretKeyRef:
                  name: sec4
                  key: user3
