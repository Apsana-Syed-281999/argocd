kind: Deployment
metadata:
  name: dply1
spec:
  selector:
    matchLabels:
      app: makeup
      env: dev
  replicas: 3
  template:
    metadata:
      name: tmplt1
      labels:
        app: makeup
        env: dev
    spec:
      containers:
        - image: apsanadevops/beauty:makeup
          name: con-1
          ports:
            - containerPort: 80
